<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Index Player</title>
    
    <link rel="stylesheet" href="./src/styles/index.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-[#0f0f0f] text-white">
    <div id="root">
        <!-- Default Fallback UI while files load -->
        <div class="flex flex-col h-screen w-full items-center justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div>
            <div id="loading-text" class="text-sm text-gray-400 font-mono text-center px-4">Initializing App...</div>
        </div>
    </div>

    <script type="module">
        import React, { useState, useEffect, useMemo, useRef, useContext } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import * as LucideIcons from 'https://esm.sh/lucide-react@0.292.0';

        // 1. Expose dependencies globally
        window.React = React;
        window.createRoot = createRoot;
        window.LucideIcons = LucideIcons;
        window.UIP = window.UIP || {};

        // 2. Exact File Map using safe relative paths
        const scripts = [
            './src/config/constants.js',
            './src/context/AppContext.jsx',
            './src/components/Shared.jsx',
            './src/components/Grids.jsx',
            './src/components/HeroBanner.jsx',
            './src/components/Modals.jsx',
            './src/pages/Views.jsx',
            './src/App.jsx',
            './src/index.jsx'
        ];

        async function loadApp() {
            const root = document.getElementById('root');
            const loadingText = document.getElementById('loading-text');
            
            try {
                if (!window.Babel) throw new Error("Babel compiler failed to load from CDN.");

                for (const src of scripts) {
                    if(loadingText) loadingText.innerText = `Fetching ${src}...`;
                    
                    const response = await fetch(src);
                    if (!response.ok) {
                        throw new Error(`HTTP Error ${response.status}: Could not find ${src}.`);
                    }
                    
                    const code = await response.text();
                    
                    if(loadingText) loadingText.innerText = `Compiling ${src}...`;
                    
                    let compiledCode = code;
                    
                    // Only transpile JSX files. 
                    // [ 'env', { modules: false } ] ensures Babel doesn't break any stray 'import' statements you left in the files.
                    if (src.endsWith('.jsx')) {
                        compiledCode = Babel.transform(code, { 
                            presets: [
                                ['env', { modules: false }], 
                                'react'
                            ] 
                        }).code;
                    }
                    
                    // Execute the script as a native module so "import" statements are perfectly legal
                    const scriptEl = document.createElement('script');
                    scriptEl.type = 'module'; // <--- THIS FIXES YOUR CRASH
                    scriptEl.textContent = compiledCode;
                    
                    try {
                        document.body.appendChild(scriptEl);
                    } catch (appendErr) {
                        throw new Error(`Syntax Error while evaluating ${src}:\n${appendErr.message}`);
                    }
                }
            } catch (err) {
                console.error(err);
                root.innerHTML = `
                    <div class="flex h-screen items-center justify-center">
                        <div class="bg-[#1e1e1e] p-8 rounded-xl max-w-xl border border-red-500/30 text-center shadow-2xl">
                            <h2 class="text-xl font-bold text-red-500 mb-2">Application Error</h2>
                            <p class="text-gray-300 text-sm font-mono bg-black/50 p-4 rounded text-left mb-4 overflow-x-auto">
                                ${err.message}
                            </p>
                        </div>
                    </div>`;
            }
        }

        // Global Error Catcher for rendering issues
        window.onerror = function(message) {
            const root = document.getElementById('root');
            if(root && !root.innerHTML.includes('Application Error')) {
                root.innerHTML = `
                    <div class="flex h-screen items-center justify-center">
                        <div class="bg-[#1e1e1e] p-8 rounded-xl max-w-xl border border-red-500/30 text-center shadow-2xl">
                            <h2 class="text-xl font-bold text-red-500 mb-2">Runtime Crash</h2>
                            <p class="text-gray-300 text-sm font-mono bg-black/50 p-4 rounded text-left">${message}</p>
                        </div>
                    </div>`;
            }
        };

        // Start Bootloader
        if (window.Babel) {
            loadApp();
        } else {
            window.addEventListener('DOMContentLoaded', () => setTimeout(loadApp, 500));
        }
    </script>
</body>
</html>
